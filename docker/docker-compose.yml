services:
  # ─────────────────────────────────────────────
  # MintClaw Agent (one-shot query)
  #   docker compose -f docker/docker-compose.yml run --rm mintclaw-agent -m "Hello"
  # ─────────────────────────────────────────────
  mintclaw-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ghcr.io/bogdanovich/mintclaw:latest
    container_name: mintclaw-agent
    profiles:
      - agent
    # Uncomment to access host network; leave commented unless needed.
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/root/.mintclaw
    entrypoint: ["mintclaw", "agent"]
    stdin_open: true
    tty: true

  # ─────────────────────────────────────────────
  # MintClaw Gateway (Long-running Bot)
  #   docker compose -f docker/docker-compose.yml --profile gateway up
  # ─────────────────────────────────────────────
  mintclaw-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ghcr.io/bogdanovich/mintclaw:latest
    container_name: mintclaw-gateway
    restart: unless-stopped
    profiles:
      - gateway
    # Uncomment to access host network; leave commented unless needed.
    #extra_hosts:
    #  - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/root/.mintclaw

  # ─────────────────────────────────────────────
  # MintClaw Launcher (Web Console + Gateway)
  #   docker compose -f docker/docker-compose.yml --profile launcher up
  # ─────────────────────────────────────────────
  mintclaw-launcher:
    build:
      context: ..
      dockerfile: docker/Dockerfile.launcher
    image: ghcr.io/bogdanovich/mintclaw:launcher
    container_name: mintclaw-launcher
    restart: unless-stopped
    profiles:
      - launcher
    environment:
      - MINTCLAW_GATEWAY_HOST=0.0.0.0
      # Set a fixed dashboard token instead of a random one each restart.
      # If not set, a random token is generated and printed to the console on startup.
      #- MINTCLAW_LAUNCHER_TOKEN=your-secret-token-here
    ports:
      - "18800:18800"
      - "18790:18790"
    volumes:
      - ./data:/root/.mintclaw
