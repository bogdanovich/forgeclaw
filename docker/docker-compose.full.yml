services:
  # ─────────────────────────────────────────────
  # MintClaw Agent (one-shot query) - Full MCP Support
  #   docker compose -f docker/docker-compose.full.yml run --rm mintclaw-agent -m "Hello"
  # ─────────────────────────────────────────────
  mintclaw-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile.full
    container_name: mintclaw-agent-full
    profiles:
      - agent
    volumes:
      - ../config/config.json:/root/.mintclaw/config.json:ro
      - mintclaw-workspace:/root/.mintclaw/workspace
      - mintclaw-npm-cache:/root/.npm # npm cache for faster MCP server installs
    entrypoint: ["mintclaw", "agent"]
    stdin_open: true
    tty: true

  # ─────────────────────────────────────────────
  # MintClaw Gateway (Long-running Bot) - Full MCP Support
  #   docker compose -f docker/docker-compose.full.yml --profile gateway up
  # ─────────────────────────────────────────────
  mintclaw-gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.full
    container_name: mintclaw-gateway-full
    restart: unless-stopped
    profiles:
      - gateway
    volumes:
      # Configuration file
      - ../config/config.json:/root/.mintclaw/config.json:ro
      # Persistent workspace (sessions, memory, logs)
      - mintclaw-workspace:/root/.mintclaw/workspace
      # NPM cache for faster MCP server installs
      - mintclaw-npm-cache:/root/.npm
    command: ["gateway"]

volumes:
  mintclaw-workspace:
  mintclaw-npm-cache: # Cache npm packages to speed up MCP server installations
