name: PR

on:
  pull_request: { }

jobs:
  lint:
    name: Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint documentation layout
        run: bash ./scripts/lint-docs.sh

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run go generate
        run: go generate ./...

      - name: Install GolangCI Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version-file: .golangci-lint-version
          install-only: true

      - name: Check Go formatting
        run: golangci-lint fmt --config=.golangci-format.yaml --diff

      - name: Run GolangCI Lint
        run: golangci-lint run --tests=false --concurrency=4 --build-tags=goolm,stdjson

  vuln_check:
    name: Security Check
    runs-on: ubuntu-latest
    env:
      GOFLAGS: -tags=goolm,stdjson
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Run Govulncheck
        run: govulncheck -C . -format text ./...

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run go generate
        run: go generate ./...

      - name: Run Go tests with timing
        shell: bash
        run: |
          set -o pipefail
          go test -json -tags goolm,stdjson ./... | tee /tmp/mintclaw-go-test.json

      - name: Publish Go test timings
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/mintclaw-go-test.json ]]; then
            go run ./scripts/testtimings < /tmp/mintclaw-go-test.json | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run targeted race regressions
        run: >-
          go test -race -tags goolm,stdjson
          -run
          '^(TestConcurrentBuildSystemPromptWithCache|TestFinish_ConcurrentCalls|TestDeliverSubTurnResult_RaceWithFinish|TestSteeringQueue_ConcurrentAccess|TestCronService_ConcurrentAccess|TestConcurrent_AddAndRead|TestConcurrent_SummarizeRace)$'
          ./pkg/agent
          ./pkg/cron
          ./pkg/memory

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run real companion vertical tests
        run: bash ./scripts/run-go-integration-tests.sh

      - name: Run Docker-backed integration suites
        run: bash ./scripts/run-integration-tests.sh

  browser_windows:
    name: Browser Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run Windows platform tests
        run: go test -tags goolm,stdjson ./pkg/browser ./pkg/fileutil
