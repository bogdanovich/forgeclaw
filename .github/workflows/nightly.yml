name: Nightly Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Nightly Build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changelog: ${{ steps.version.outputs.changelog }}
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          DATE=$(date -u +%Y%m%d)
          SHA=$(git rev-parse --short=8 HEAD)
          BASE_VERSION=$(git describe --tags --match "v*" --exclude "*nightly*" --abbrev=0 2>/dev/null || true)
          readonly BASE_VERSION_PATTERN='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [ -n "${BASE_VERSION}" ] && [[ ! "${BASE_VERSION}" =~ ${BASE_VERSION_PATTERN} ]]; then
            echo "::error::Latest release tag does not use the admitted stable SemVer grammar."
            exit 1
          fi
          if [ -z "$BASE_VERSION" ] || [ "$BASE_VERSION" = "v0.0.0" ]; then
            VERSION="v0.0.0-nightly.${DATE}.${SHA}"
          else
            VERSION="${BASE_VERSION}-nightly.${DATE}.${SHA}"
          fi

          COMPARE_URL="https://github.com/${REPOSITORY}/commits/main"
          if [ -n "$BASE_VERSION" ] && [ "$BASE_VERSION" != "v0.0.0" ]; then
            COMPARE_URL="https://github.com/${REPOSITORY}/compare/${BASE_VERSION}...main"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "changelog=**Full Changelog**: $COMPARE_URL" >> "$GITHUB_OUTPUT"

      - name: Setup Go from go.mod
        id: setup-go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/frontend/pnpm-lock.yaml

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install zip
        run: sudo apt-get install -y zip

      - name: Create local tag for GoReleaser
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: git tag "${RELEASE_VERSION}"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ~> v2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GOVERSION: ${{ steps.setup-go.outputs.go-version }}
          GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.version }}
          INCLUDE_ANDROID_BUNDLE: "true"
          NIGHTLY_BUILD: "true"

      - name: Preserve unsigned release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nightly-release-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 1
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*checksums.txt
            build/mintclaw-android-universal.zip

  sign-and-publish:
    name: Sign And Publish Nightly
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout trusted release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Go from go.mod
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build trusted node release signer
        shell: bash
        run: go build -o "${RUNNER_TEMP}/mintclaw-node-release" ./cmd/mintclaw-node-release

      - name: Download unsigned release artifacts
        uses: actions/download-artifact@v8
        with:
          name: nightly-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      - name: Sign node release manifest
        shell: bash
        env:
          MINTCLAW_NODE_RELEASE_SIGNING_KEY: ${{ secrets.MINTCLAW_NODE_RELEASE_SIGNING_KEY }}
          MINTCLAW_NODE_RELEASE: ${{ needs.build.outputs.version }}
          MINTCLAW_NODE_RELEASE_CHANNEL: nightly
          MINTCLAW_NODE_MIN_COORDINATOR_VERSION: v1.0.0
          MINTCLAW_NODE_RELEASE_ARTIFACTS: >-
            linux/amd64/dist/mintclaw-node_Linux_x86_64.tar.gz
            linux/arm64/dist/mintclaw-node_Linux_arm64.tar.gz
            darwin/amd64/dist/mintclaw-node_Darwin_x86_64.tar.gz
            darwin/arm64/dist/mintclaw-node_Darwin_arm64.tar.gz
          MINTCLAW_NODE_MANIFEST_PATH: dist/mintclaw-node-manifest.json
          MINTCLAW_NODE_SIGNATURE_PATH: dist/mintclaw-node-manifest.sig
        run: |
          export MINTCLAW_NODE_RELEASE_PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:00Z)"
          "${RUNNER_TEMP}/mintclaw-node-release" sign

      - name: Update nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          CHANGELOG: ${{ needs.build.outputs.changelog }}
          RELEASE_TARGET: ${{ github.sha }}
        run: |
          NOTES=$(cat <<EOF
          Nightly build for **${VERSION}**

          This is an automated build and may be unstable. Use with caution.

          ${CHANGELOG}
          EOF
          )

          # Delete existing nightly release and tag
          gh release delete nightly --cleanup-tag -y 2>/dev/null || true

          # Force-update nightly tag to current HEAD
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -fa nightly -m "Nightly build ${VERSION}"
          git push origin nightly

          # Collect release artifacts from goreleaser dist/
          ASSETS=()
          for f in dist/*.tar.gz dist/*.zip dist/*.deb dist/*.rpm dist/*checksums.txt \
            dist/mintclaw-node-manifest.json dist/mintclaw-node-manifest.sig \
            build/mintclaw-android-universal.zip; do
            [ -f "$f" ] && ASSETS+=("$f")
          done

          # Create nightly release (prerelease, NOT latest)
          gh release create nightly \
            --title "Nightly Build" \
            --notes "$NOTES" \
            --target "${RELEASE_TARGET}" \
            --prerelease \
            --latest=false \
            "${ASSETS[@]}"
