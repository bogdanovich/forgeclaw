version: "2"

linters:
  # Keep this list explicit. "default: all" makes upgrades silently add new,
  # potentially expensive or noisy linters.
  default: none
  enable:
    # Correctness and suspicious control flow.
    - asasalint
    - canonicalheader
    - durationcheck
    - fatcontext
    - gocheckcompilerdirectives
    - gochecksumtype
    - govet
    - ineffassign
    - makezero
    - nilerr
    - nilnesserr
    - reassign
    - unconvert
    - wastedassign

    # Resource lifecycle and protocol safety.
    - bodyclose
    - nosprintfhostport
    - rowserrcheck
    - sqlclosecheck

    # Cheap security and maintainability checks.
    - bidichk
    - errname
    - goprintffuncname
    - iotamixing
    - misspell
    - nolintlint
    - protogetter
    - recvcheck
    - zerologlint

    # Module policy.
    - gomoddirectives

  # Valuable checks that currently have a substantial existing backlog:
  # errcheck (50+), errorlint (12), and staticcheck (50+). Enable each after
  # its findings are fixed or narrowly baselined. Gosec is better maintained
  # as a separately tuned security job because its default rules are noisy for
  # this CLI/server codebase.
  settings:
    gomoddirectives:
      replace-allow-list:
        - github.com/bwmarrin/discordgo
    govet:
      enable:
        - shadow
      disable:
        # Go 1.26 modernization suggestion with little correctness value.
        - inline
    misspell:
      locale: US
  exclusions:
    generated: lax
    rules:
      - linters:
          - nolintlint
        path: 'pkg/tools/(i2c\.go|spi\.go)$'

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
